<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit event — Campus Event Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md cems-nav">
  <div class="container">
    <a class="navbar-brand" href="/">Campus<span class="brand-mark">Events</span></a>
    <div>
      <a class="nav-link d-inline" data-path="/admin-dashboard" href="/admin-dashboard">← Back to admin dashboard</a>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <span class="eyebrow">Edit event</span>
      <h1 class="mt-1 mb-4" style="font-size:1.8rem;">Update event details</h1>

      <div id="event-form-msg" class="form-msg"></div>

      <form id="event-form" novalidate>
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" required>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="4"></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" required>
          </div>
          <div class="col-md-6">
            <label for="venue" class="form-label">Venue</label>
            <input type="text" class="form-control" id="venue" required>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="eventDate" class="form-label">Date</label>
            <input type="date" class="form-control" id="eventDate" required>
          </div>
          <div class="col-md-4">
            <label for="startTime" class="form-label">Start time</label>
            <input type="time" class="form-control" id="startTime" required>
          </div>
          <div class="col-md-4">
            <label for="endTime" class="form-label">End time</label>
            <input type="time" class="form-control" id="endTime" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="capacity" class="form-label">Capacity</label>
          <input type="number" class="form-control" id="capacity" min="1" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save changes</button>
          <a href="/admin-dashboard" class="btn btn-outline-ink">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="cems-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>Campus Event Management System</span>
    <span>CSE 4635 — Web Architecture Project</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
