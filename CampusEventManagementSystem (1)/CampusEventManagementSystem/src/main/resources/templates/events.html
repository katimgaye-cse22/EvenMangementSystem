<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse events — Campus Event Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md cems-nav">
  <div class="container">
    <a class="navbar-brand" href="/">Campus<span class="brand-mark">Events</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-1">
        <li class="nav-item"><a class="nav-link" data-path="/" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link active" data-path="/events" href="/events">Browse events</a></li>
        <li class="nav-item" sec:authorize="hasRole('STUDENT')"><a class="nav-link" data-path="/my-events" href="/my-events">My events</a></li>
        <li class="nav-item" sec:authorize="hasRole('STUDENT')"><a class="nav-link" data-path="/dashboard" href="/dashboard">Dashboard</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" data-path="/admin-dashboard" href="/admin-dashboard">Admin dashboard</a></li>
        <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" href="/login">Log in</a></li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
          <a class="btn btn-nav-cta btn-sm ms-md-2" href="/register">Sign up</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" href="#" data-action="logout">Log out</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="section-heading">
    <div>
      <span class="eyebrow">Campus calendar</span>
      <h1 class="mt-1" style="font-size:1.9rem;">Browse events</h1>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <input type="search" id="search-input" class="form-control" placeholder="Search by title or description…">
    </div>
    <div class="col-md-3">
      <select id="category-select" class="form-select">
        <option value="">All categories</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="sort-select" class="form-select">
        <option value="eventDate:asc">Soonest first</option>
        <option value="eventDate:desc">Latest first</option>
        <option value="title:asc">Title (A–Z)</option>
        <option value="registeredCount:desc">Most registered</option>
      </select>
    </div>
  </div>

  <div id="events-list"></div>

  <nav aria-label="Events pagination" class="mt-4">
    <ul class="pagination justify-content-center" id="events-pagination"></ul>
  </nav>
</main>

<footer class="cems-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>Campus Event Management System</span>
    <span>CSE 4635 — Web Architecture Project</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
