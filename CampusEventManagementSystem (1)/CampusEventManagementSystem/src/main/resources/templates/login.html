<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Campus Event Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md cems-nav">
  <div class="container">
    <a class="navbar-brand" href="/">Campus<span class="brand-mark">Events</span></a>
    <div>
      <a class="nav-link d-inline" data-path="/events" href="/events">Browse events</a>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h1 class="mt-2 mb-4" style="font-size:1.8rem;">Log in to your account</h1>

      <div id="login-msg" class="form-msg"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>

      <p class="text-center mt-4 mb-0" style="font-size:0.9rem; color:var(--slate);">
        Don't have an account? <a href="/register">Sign up</a>
      </p>
    </div>
  </div>
</main>

<footer class="cems-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>Campus Event Management System</span>
    <span>CSE 4635 — Web Architecture Project</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
