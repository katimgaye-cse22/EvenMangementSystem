<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Campus Event Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-md cems-nav">
  <div class="container">
    <a class="navbar-brand" href="/">Campus<span class="brand-mark">Events</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="border-color: rgba(255,255,255,0.3);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-1">
        <li class="nav-item"><a class="nav-link" data-path="/" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" data-path="/events" href="/events">Browse events</a></li>
        <li class="nav-item"><a class="nav-link" data-path="/my-events" href="/my-events">My events</a></li>
        <li class="nav-item"><a class="nav-link active" data-path="/dashboard" href="/dashboard">Dashboard</a></li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-action="logout">Log out</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <span class="eyebrow">Student dashboard</span>
  <h1 class="mt-1 mb-4" id="dashboard-greeting" style="font-size:1.9rem;">Welcome back</h1>

  <div class="row g-3 mb-5">
    <div class="col-sm-4">
      <div class="stat-card">
        <div class="stat-number" id="stat-registered">—</div>
        <div class="stat-label">Events registered</div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="stat-card">
        <a href="/events" class="btn btn-brass w-100">Browse events</a>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="stat-card">
        <a href="/my-events" class="btn btn-outline-ink w-100">View my events</a>
      </div>
    </div>
  </div>

  <div class="section-heading">
    <h2 style="font-size:1.3rem;">Your upcoming registrations</h2>
    <a href="/my-events" style="font-size:0.9rem;">See all →</a>
  </div>
  <div id="dashboard-upcoming"><div class="skeleton" style="height:70px;"></div></div>
</main>

<footer class="cems-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>Campus Event Management System</span>
    <span>CSE 4635 — Web Architecture Project</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
