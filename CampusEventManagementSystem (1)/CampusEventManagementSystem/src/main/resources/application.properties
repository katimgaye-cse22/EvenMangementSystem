# ============================================
# Application Info
# ============================================
spring.application.name=Campus Event Management System
server.port=8080

# ============================================
# MySQL Database Connection
# ============================================
# Create the database first: CREATE DATABASE campus_event_db;
spring.datasource.url=jdbc:mysql://localhost:3306/campus_event_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=5243324@gmail.com
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
# update: keeps schema in sync with entities during development.
# Switch to "validate" once the schema is stable, and rely on schema.sql for DDL in production-style setups.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================
# SQL Init (schema.sql / data.sql)
# ============================================
# "always" seeds the admin account in data.sql on every startup (safe:
# INSERT IGNORE + unique email constraint prevent duplicates).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ============================================
# Thymeleaf
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================
# Logging
# ============================================
logging.level.org.springframework.security=DEBUG
logging.level.com.campus.eventmanagement=DEBUG

# ============================================
# Multipart (for future event image uploads)
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB